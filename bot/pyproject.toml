[project]
name = "watchdemo-bot"
version = "0.1.0"
description = "Telegram support bot @watchdemopro_bot for WatchDemo"
authors = [
    {name = "Schus Maxim", email = "mazik.schus@gmail.com"}
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiogram (>=3.31.0,<4.0.0)",
    "aio-pika (>=9.5.0,<11.0.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
]

[dependency-groups]
dev = ["pytest (>=9.0.0,<10.0.0)"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
