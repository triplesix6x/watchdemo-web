# Shared security headers. nginx drops server-level add_header in any location that sets
# its own, so every such location includes this file again.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Self-only: fonts are self-hosted (@fontsource), the pre-paint flag script is /boot.js,
# JSON-LD is a data block and is not executed. Inline styles stay for GSAP.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
