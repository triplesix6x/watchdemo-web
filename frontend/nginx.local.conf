# Isolated mock preview: no upstreams, API proxy, TLS, or production settings.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        error_page 404 /404.html;

        location = /api { return 503; }
        location ^~ /api/ { return 503; }
        location ~ ^/(en/)?(__ui|login|register|forgot-password|reset-password|verify-email|resend-verification|confirm-email-change|account|admin|dashboard|sessions)(/|$) {
            try_files /app.html =404;
        }
        location /en/ {
            error_page 404 /en/404.html;
            try_files $uri $uri/index.html =404;
        }
        location / { try_files $uri $uri/index.html =404; }
    }
}
