# Isolated real local preview; only internal Compose upstreams, local TLS.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        listen 8443 ssl;
        ssl_certificate /etc/nginx/local-certs/cert.pem;
        ssl_certificate_key /etc/nginx/local-certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        error_page 404 /404.html;

        location = /__local/mail {
            proxy_pass http://mail-capture:8025/;
        }
        location = /api { return 404; }
        location ^~ /api/ {
            proxy_pass http://web:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            client_max_body_size 12m;
        }
        location ~ ^/(en/)?(__ui|auth/social/complete|login|register|forgot-password|reset-password|verify-email|resend-verification|confirm-email-change|account|admin|dashboard|sessions)(/|$) {
            try_files /app.html =404;
        }
        location /en/ {
            error_page 404 /en/404.html;
            try_files $uri $uri/index.html =404;
        }
        location / { try_files $uri $uri/index.html =404; }
    }
}
