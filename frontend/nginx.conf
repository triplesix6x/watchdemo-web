server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    # Заливка сборки из админки. Отдельный location, потому что дефолтный
    # client_max_body_size у nginx — 1 МБ, и инсталлятор в него не лезет.
    # Буферизацию запроса отключаем: незачем складывать сотню мегабайт на
    # диск nginx перед тем, как отдать их приложению.
    location /api/v1/admin/releases {
        client_max_body_size 600m;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API calls to backend - avoids CORS entirely
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Инсталляторы десктопного приложения. Раздаёт nginx, а не FastAPI:
    # гонять сотню мегабайт через uvicorn незачем. Файлы кладёт на общий
    # том админский эндпоинт публикации релиза.
    location /releases/ {
        alias /usr/share/nginx/releases/;
        autoindex off;
        gzip off;
        sendfile on;
        tcp_nopush on;
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "attachment" always;
        # Версия в пути неизменяема — можно кешировать надолго.
        expires 30d;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't expose nginx version
    server_tokens off;
}
