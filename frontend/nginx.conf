server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml application/manifest+json;

    include /etc/nginx/snippets/security-headers.conf;

    # Unknown paths get a real 404 with the designed page (prerendered per locale).
    error_page 404 /404.html;

    # Заливка сборки из админки. Отдельный location, потому что дефолтный
    # client_max_body_size у nginx — 1 МБ, и инсталлятор в него не лезет.
    # Буферизацию запроса отключаем: незачем складывать сотню мегабайт на
    # диск nginx перед тем, как отдать их приложению.
    location ^~ /api/v1/admin/releases {
        client_max_body_size 600m;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API calls to backend - avoids CORS entirely
    location ^~ /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Инсталляторы десктопного приложения. Раздаёт nginx, а не FastAPI:
    # гонять сотню мегабайт через uvicorn незачем. Файлы кладёт на общий
    # том админский эндпоинт публикации релиза.
    location ^~ /releases/ {
        alias /usr/share/nginx/releases/;
        autoindex off;
        gzip off;
        sendfile on;
        tcp_nopush on;
        default_type application/octet-stream;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Disposition "attachment" always;
        # Версия в пути неизменяема — можно кешировать надолго.
        expires 30d;
    }

    # Hashed build output: cache forever. ^~ keeps the image rule below from taking it.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA routes (auth, cabinet, admin, old URLs): one shell, the client router decides.
    location ~ ^/(en/)?(login|register|forgot-password|reset-password|verify-email|resend-verification|confirm-email-change|account|admin|dashboard|sessions)(/|$) {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /app.html =404;
    }

    # English pages and their own 404.
    location ~ ^/en(/|$) {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        error_page 404 /en/404.html;
        try_files $uri $uri/index.html =404;
    }

    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Prerendered public pages (dist/<path>/index.html) and static files. HTML must
    # revalidate so a deploy shows up at once; unhashed images keep a day.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }

    location ~* ^/(brand|screens)/|\.(png|webp|ico|svg|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }
}
